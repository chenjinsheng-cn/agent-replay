server.port=8081
spring.application.name=agent-replay

# ---------------------------------------------------------------------------
# 存储：H2 文件库
#
# 为什么不用 MySQL / Redis？
# 这个项目要证明的是「事件流能完整还原一次运行」，难点在事件模型和重放逻辑，
# 不在数据库选型。H2 文件模式零依赖，clone 下来就能跑；表结构仍然是标准的
# 关系模型（run 一对多 event，run_id + seq 唯一），换成 MySQL 只需要改这一行 URL。
# ---------------------------------------------------------------------------
# ⚠️ 不要写 AUTO_SERVER=TRUE 配 DB_CLOSE_ON_EXIT=FALSE：H2 2.2 直接抛
#    JdbcSQLFeatureNotSupportedException("AUTO_SERVER=TRUE && DB_CLOSE_ON_EXIT=FALSE")，
#    而且报错发生在 JPA 建 EntityManagerFactory 之前，最后只看到一句
#    「Unable to determine Dialect」——离真因隔了两层。
#    这里两个都不需要：进程内只有应用自己在连，H2 控制台也是同进程。
spring.datasource.url=jdbc:h2:file:./data/agent-replay
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# ---------------------------------------------------------------------------
# 模型接入：双模式
#
#   recorded —— 只读 events/ 下录制好的固定响应，不联网。默认值。
#               仓库 clone 下来直接能跑，不需要任何 key，结果每次一样。
#   real     —— 真的请求 DeepSeek（OpenAI 兼容接口）。
#
# key 只从环境变量读，不写进任何配置文件。
# ---------------------------------------------------------------------------
agent.llm.mode=recorded
agent.llm.base-url=https://api.deepseek.com
agent.llm.model=deepseek-chat
agent.llm.api-key=${DEEPSEEK_API_KEY:}
agent.llm.timeout=60s

# temperature 固定 0：不是为了「让模型确定性」（它做不到），
# 而是让真实运行这一侧的变量少一个。真正要复现靠的是录制，不是这个参数。
agent.llm.temperature=0

# 工具能碰的目录。file_write 只允许写这个目录下面。
agent.files.workspace=./workspace

# 单次运行最多几步。防止模型一直调工具转圈。
agent.loop.max-steps=8

logging.level.com.chenjinsheng.agentreplay=INFO
